<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Automatic Irrigation and Fertigation Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    .tab {
      padding: 20px;
    }
    h2 {
      text-align: center;
    }
    .dashboard-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      margin-bottom: 40px;
    }
    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      margin: 10px;
      flex: 0 1 300px;
      text-align: center;
    }
    .gauge-container {
      width: 180px;
      height: 180px;
      margin: 0 auto;
      position: relative;
    }
    .gauge-value {
      font-size: 22px;
      font-weight: bold;
      position: absolute;
      width: 100%;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      text-align: center;
    }
    .ui-button {
      display: inline-block;
      padding: 10px 20px;
      margin: 10px 0;
      background-color: #1976d2;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
    }
    .ui-button:hover {
      background-color: #1565c0;
    }
    .status-text {
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="tab">
    <h2>Automatic Irrigation and Fertigation Dashboard</h2>

    <!-- Soil Moisture -->
    <div class="dashboard-group">
      <div class="card">
        <h3>Soil Moisture (%)</h3>
        <canvas id="soilChart" width="250" height="150"></canvas>
        <div class="gauge-container">
          <canvas id="soilGauge"></canvas>
          <div class="gauge-value" id="soilValue">--%</div>
        </div>
        <div class="status-text" id="soilStatus">Status: --</div>
      </div>
    </div>

    <!-- Temperature -->
    <div class="dashboard-group">
      <div class="card">
        <h3>Temperature (℃)</h3>
        <canvas id="tempChart" width="250" height="150"></canvas>
        <div class="gauge-container">
          <canvas id="tempGauge"></canvas>
          <div class="gauge-value" id="tempValue">--℃</div>
        </div>
        <div class="status-text" id="tempStatus">Status: --</div>
      </div>
    </div>

    <!-- Water Level -->
    <div class="dashboard-group">
      <div class="card">
        <h3>Water Level (cm)</h3>
        <canvas id="waterChart" width="250" height="150"></canvas>
        <div class="gauge-container">
          <canvas id="waterGauge"></canvas>
          <div class="gauge-value" id="waterValue">--cm</div>
        </div>
        <div class="status-text" id="waterStatus">Status: --</div>
      </div>
    </div>

    <!-- Fertilizer Level -->
    <div class="dashboard-group">
      <div class="card">
        <h3>Fertilizer Level (cm)</h3>
        <canvas id="fertChart" width="250" height="150"></canvas>
        <div class="gauge-container">
          <canvas id="fertGauge"></canvas>
          <div class="gauge-value" id="fertValue">--cm</div>
        </div>
        <div class="status-text" id="fertStatus">Status: --</div>
      </div>
    </div>

    <!-- Relays -->
    <div class="dashboard-group">
      <div class="card">
        <h3>Relay 1 Status</h3>
        <div class="status-text" id="relay1Status">--</div>
      </div>
      <div class="card">
        <h3>Relay 2 Status</h3>
        <div class="status-text" id="relay2Status">--</div>
        <div class="status-text">Monday 5:00 AM</div>
      </div>
    </div>

    <!-- Export -->
    <div class="dashboard-group">
      <a href="/node-red-data/sensor_data.xlsx" download class="ui-button">📥 Download Excel File</a>
    </div>
  </div>

  <script>
    // Chart creation helper
    function createChart(canvasId, label, color) {
      const ctx = document.getElementById(canvasId).getContext('2d');
      return new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [{ label, data: [], borderColor: color, fill: true, backgroundColor: 'rgba(25,118,210,0.2)', tension: 0.3 }] },
        options: { scales: { y: { min: 0, max: 100 } } }
      });
    }

    const soilChart = createChart('soilChart', 'Soil Moisture (%)', 'green');
    const tempChart = createChart('tempChart', 'Temperature (℃)', 'red');
    const waterChart = createChart('waterChart', 'Water Level (cm)', 'blue');
    const fertChart = createChart('fertChart', 'Fertilizer Level (cm)', 'orange');

    // Gauge creation helper
    function createGauge(canvasId, color) {
      const ctx = document.getElementById(canvasId).getContext('2d');
      return new Chart(ctx, {
        type: 'doughnut',
        data: {
          datasets: [{
            data: [0, 100],
            backgroundColor: [color, '#e0e0e0'],
            borderWidth: 0
          }]
        },
        options: {
          rotation: -90,
          circumference: 180,
          cutout: '80%',
          plugins: { legend: { display: false }, tooltip: { enabled: false } }
        }
      });
    }

    const soilGauge = createGauge('soilGauge', 'green');
    const tempGauge = createGauge('tempGauge', 'red');
    const waterGauge = createGauge('waterGauge', 'blue');
    const fertGauge = createGauge('fertGauge', 'orange');

    function updateGauge(chart, value, textId, unit) {
      chart.data.datasets[0].data[0] = value;
      chart.data.datasets[0].data[1] = 100 - value;
      chart.update();
      document.getElementById(textId).innerText = value + unit;
    }

    // Example simulation
    setInterval(() => {
      const soil = Math.floor(Math.random() * 100);
      const temp = Math.floor(Math.random() * 50);
      const water = Math.floor(Math.random() * 100);
      const fert = Math.floor(Math.random() * 100);

      updateGauge(soilGauge, soil, 'soilValue', '%');
      updateGauge(tempGauge, temp, 'tempValue', '℃');
      updateGauge(waterGauge, water, 'waterValue', 'cm');
      updateGauge(fertGauge, fert, 'fertValue', 'cm');

      soilChart.data.labels.push('');
      soilChart.data.datasets[0].data.push(soil);
      if (soilChart.data.datasets[0].data.length > 10) soilChart.data.datasets[0].data.shift();
      soilChart.update();

      tempChart.data.labels.push('');
      tempChart.data.datasets[0].data.push(temp);
      if (tempChart.data.datasets[0].data.length > 10) tempChart.data.datasets[0].data.shift();
      tempChart.update();

      waterChart.data.labels.push('');
      waterChart.data.datasets[0].data.push(water);
      if (waterChart.data.datasets[0].data.length > 10) waterChart.data.datasets[0].data.shift();
      waterChart.update();

      fertChart.data.labels.push('');
      fertChart.data.datasets[0].data.push(fert);
      if (fertChart.data.datasets[0].data.length > 10) fertChart.data.datasets[0].data.shift();
      fertChart.update();
    }, 2000);
  </script>

</body>
</html>
