<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌾 Automatic Water Sprinkler with Fertilization </title>
  <script src="https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gaugeJS/dist/gauge.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f4f9f4;
      margin: 0;
      text-align: center;
    }
    header {
      background: #4caf50;
      color: white;
      padding: 15px;
      font-size: 1.6em;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    .status {
      margin-top: 10px;
      font-weight: bold;
      font-size: 1.1em;
    }
    .wave-container {
      position: relative;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      overflow: hidden;
      background: #e0f7fa;
      margin: auto;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.2);
    }
    .wave {
      position: absolute;
      width: 200%;
      height: 200%;
      left: -50%;
      border-radius: 40%;
      animation: wave 4s infinite linear;
    }
    @keyframes wave {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    canvas {
      display: block;
      margin: auto;
    }
    button {
      background: #4caf50;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1em;
    }
    button:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
  <header>🌾 Smart Farming Dashboard</header>

  <div class="container">
    <div class="card">
      <h3>🌡️ Temperature</h3>
      <canvas id="tempGauge" width="200" height="200"></canvas>
      <div id="tempStatus" class="status">--</div>
    </div>

    <div class="card">
      <h3>🌱 Soil Moisture</h3>
      <canvas id="soilGauge" width="200" height="200"></canvas>
      <div id="soilStatus" class="status">--</div>
    </div>

    <div class="card">
      <h3>💧 Water Level</h3>
      <div class="wave-container">
        <div class="wave" id="waterWave" style="background: rgba(33,150,243,0.6); top: 80%;"></div>
      </div>
      <div id="waterStatus" class="status">--</div>
    </div>

    <div class="card">
      <h3>🧪 Fertilizer Level</h3>
      <div class="wave-container">
        <div class="wave" id="fertWave" style="background: rgba(255,165,0,0.6); top: 80%;"></div>
      </div>
      <div id="fertStatus" class="status">📅 Schedule for Fertilizing Monday 6AM</div>
    </div>

    <div class="card">
      <h3>⚙️ Pump1 Status</h3>
      <div id="pump1Status" class="status">--</div>
    </div>

    <div class="card">
      <h3>📈 Live Sensor Charts</h3>
      <canvas id="liveChart"></canvas>
      <button id="exportBtn">Export to Excel</button>
    </div>
  </div>

  <script>
    // ===============================
    // 🔗 MQTT Flespi Connection Setup
    // ===============================
    const client = mqtt.connect('wss://mqtt.flespi.io:443', {
      username: 'FlespiToken QGE7NyfGF3wfQDIaFbtlRbIAtNISsgmCRziAPBk6qcEbCKmE6Z4DnraLRnEKds8f',
    });

    client.on('connect', () => {
      console.log('✅ Connected to Flespi MQTT');
      client.subscribe('ttgo/all_sensors');
    });

    client.on('error', (err) => console.error('MQTT Error:', err));

    // ===============================
    // 🌡️ Gauge Setup (Temperature & Soil)
    // ===============================
    const tempGauge = new Gauge(document.getElementById('tempGauge')).setOptions({
      angle: 0.15,
      lineWidth: 0.25,
      radiusScale: 0.9,
      pointer: { length: 0.6, strokeWidth: 0.04, color: '#000' },
      limitMax: true,
      colorStart: '#00bfff',
      colorStop: '#ff0000',
      strokeColor: '#eee',
      generateGradient: true
    });
    tempGauge.maxValue = 60;
    tempGauge.setMinValue(0);
    tempGauge.animationSpeed = 32;
    tempGauge.set(0);

    const soilGauge = new Gauge(document.getElementById('soilGauge')).setOptions({
      angle: 0.15,
      lineWidth: 0.25,
      radiusScale: 0.9,
      pointer: { length: 0.6, strokeWidth: 0.04, color: '#000' },
      limitMax: true,
      colorStart: '#00ff00',
      colorStop: '#006400',
      strokeColor: '#eee',
      generateGradient: true
    });
    soilGauge.maxValue = 100;
    soilGauge.setMinValue(0);
    soilGauge.animationSpeed = 32;
    soilGauge.set(0);

    // ===============================
    // 📊 Live Chart Setup
    // ===============================
    const ctx = document.getElementById('liveChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          { label: 'Temperature (°C)', borderColor: 'red', data: [] },
          { label: 'Soil Moisture (%)', borderColor: 'green', data: [] },
          { label: 'Water Level (%)', borderColor: 'blue', data: [] },
          { label: 'Fertilizer Level (%)', borderColor: 'orange', data: [] },
        ],
      },
      options: {
        responsive: true,
        animation: false,
        scales: { y: { beginAtZero: true, max: 100 } },
      },
    });

    const sensorData = [];

    // ===============================
    // 📥 Handle Incoming MQTT Data
    // ===============================
    client.on('message', (topic, message) => {
      const payload = JSON.parse(message.toString());
      const { temp, soil_avg, water_level, fert_level, relay1 } = payload;

      const timestamp = new Date().toLocaleTimeString();
      chart.data.labels.push(timestamp);
      chart.data.datasets[0].data.push(temp);
      chart.data.datasets[1].data.push(soil_avg);
      chart.data.datasets[2].data.push(water_level);
      chart.data.datasets[3].data.push(fert_level);
      chart.update();

      sensorData.push({ timestamp, temp, soil_avg, water_level, fert_level, relay1 });

      // Update gauges
      tempGauge.set(temp);
      soilGauge.set(soil_avg);

      // Temperature Status
      document.getElementById('tempStatus').textContent =
        temp <= 30 ? "🌤️ Warm" : "🔥 Hot";

      // Soil Status
      document.getElementById('soilStatus').textContent =
        soil_avg <= 40 ? "🌵 Dry" : "💧 Wet";

      // Water Wave
      const waterWave = document.getElementById('waterWave');
      waterWave.style.top = `${100 - water_level}%`;
      document.getElementById('waterStatus').textContent =
        water_level <= 30 ? "🚱 Water is Not Sufficient" : "💦 Water is Sufficient";

      // Fertilizer Wave
      const fertWave = document.getElementById('fertWave');
      fertWave.style.top = `${100 - fert_level}%`;
      document.getElementById('fertStatus').textContent =
        "📅 Schedule for Fertilizing Monday 6AM";

      // Pump1 Status
      document.getElementById('pump1Status').textContent =
        relay1 === "Dry" ? "🟢 ON" : "🔴 OFF";
    });

    // ===============================
    // 📤 Export to Excel
    // ===============================
    document.getElementById('exportBtn').addEventListener('click', () => {
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.json_to_sheet(sensorData);
      XLSX.utils.book_append_sheet(wb, ws, "SensorData");
      XLSX.writeFile(wb, "SmartFarmData.xlsx");
    });
  </script>
</body>
</html>
